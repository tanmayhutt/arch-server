services:
  arch-server-web:
    build:
      context: .
      dockerfile: website/Dockerfile
    container_name: arch-server-docs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      - telemetry

  # Deploy console API and engine. Reaches Docker only through the socket proxy,
  # the router only through its private admin network, and apps through arch-apps.
  platform:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: arch-server-platform
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - CF_ACCESS_GUEST_AUD=${CF_ACCESS_GUEST_AUD:-}
      - PLATFORM_OWNER_EMAIL=${PLATFORM_OWNER_EMAIL:-}
      - PLATFORM_SECRET_KEY=${PLATFORM_SECRET_KEY:-}
      - PLATFORM_GITHUB_TOKEN=${PLATFORM_GITHUB_TOKEN:-}
      - PLATFORM_BUILD_KEY=${PLATFORM_BUILD_KEY:-}
      - PLATFORM_BUILDER_REPO=tanmayhutt/arch-builder
      - ROUTER_ADMIN_URL=http://10.217.83.2:2019
      - APPS_NETWORK=arch-apps
    volumes:
      - platform-data:/data
    networks:
      - default
      - docker-api
      - router-admin
      - apps
    depends_on:
      - docker-proxy
      - router
    deploy:
      resources:
        limits:
          memory: 160M
          cpus: '0.25'

  # Routes *.tanmaytiwari.me to deployed app containers. Its configuration is pushed by the
  # platform through an admin API reachable only on the internal router-admin network.
  router:
    image: caddy:2.11.4-alpine
    container_name: arch-server-router
    restart: unless-stopped
    command: caddy run --config /etc/caddy/initial.json --resume
    read_only: true
    cap_drop:
      - ALL
    # The official binary carries this file capability; without it exec fails with EPERM.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./platform/router/initial.json:/etc/caddy/initial.json:ro
      - router-config:/config
      - router-data:/data
    tmpfs:
      - /tmp
    networks:
      default:
      apps:
      # Fixed address: the admin API binds here only, never on the default or apps networks.
      router-admin:
        ipv4_address: 10.217.83.2
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  # Docker API filter. POST is required to create and start app containers; the platform
  # only acts on containers labelled arch.platform.managed. Exec, secrets, swarm, and
  # plugins stay blocked.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: arch-server-docker-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - POST=1
      - EXEC=0
      - LOG_LEVEL=warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  telemetry:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    container_name: arch-server-telemetry
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - DEPLOY_COMMIT=${DEPLOY_COMMIT:-unknown}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ./website:/host/storage:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    security_opt:
      - no-new-privileges:true

networks:
  # No external connectivity; only the platform service can reach the Docker proxy.
  docker-api:
    internal: true
  # Caddy's admin API has no authentication, so it lives on its own internal network.
  router-admin:
    internal: true
    ipam:
      config:
        - subnet: 10.217.83.0/29
  # Deployed apps, the router, and the platform health checker. Apps cannot reach the
  # Docker proxy or the router admin API.
  apps:
    name: arch-apps
    ipam:
      config:
        - subnet: 10.217.84.0/24

volumes:
  platform-data:
  router-config:
  router-data:
