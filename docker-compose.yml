services:
  arch-server-web:
    build:
      context: .
      dockerfile: website/Dockerfile
    container_name: arch-server-docs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      - telemetry

  # Deploy console API. Phase 1 is inventory only: Docker is reached through a
  # proxy that allows GET requests and nothing else.
  platform:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: arch-server-platform
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - PLATFORM_OWNER_EMAIL=${PLATFORM_OWNER_EMAIL:-}
    networks:
      - default
      - docker-api
    depends_on:
      - docker-proxy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: arch-server-docker-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - POST=0
      - LOG_LEVEL=warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  telemetry:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    container_name: arch-server-telemetry
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - DEPLOY_COMMIT=${DEPLOY_COMMIT:-unknown}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ./website:/host/storage:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    security_opt:
      - no-new-privileges:true

networks:
  # No external connectivity; only the platform service can reach the Docker proxy.
  docker-api:
    internal: true
