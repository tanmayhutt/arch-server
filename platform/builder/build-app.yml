# Canonical copy of the builder workflow. It runs from the private tanmayhutt/arch-builder
# repository (as .github/workflows/build-app.yml) so build logs, inputs, and caches stay private.
# Sync it there after changes: see platform/README.md.
name: Build app

# Dispatched by the deploy console. Builds one repository commit into an image and streams it to
# the server through a restricted SSH key that can only load arch-apps images.
run-name: build ${{ inputs.deployment_id }}

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Deployment id from the console
        required: true
        type: string
      repository:
        description: Source repository (owner/name)
        required: true
        type: string
      ref:
        description: Commit SHA or branch
        required: true
        type: string
      root_dir:
        description: App directory inside the repository
        required: false
        type: string
        default: ''
      image:
        description: Image tag to load on the server
        required: true
        type: string
      build_env:
        description: Encrypted build variables (AES-256-GCM, bound to the deployment id)
        required: false
        type: string
        default: ''
      source_upload:
        description: Branch in this repository holding an uploaded source.zip
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-${{ inputs.deployment_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      SOURCE_REPOSITORY: ${{ inputs.repository }}
      SOURCE_REF: ${{ inputs.ref }}
      ROOT_DIR: ${{ inputs.root_dir }}
      IMAGE: ${{ inputs.image }}
      SOURCE_UPLOAD: ${{ inputs.source_upload }}
      RAILPACK_VERSION: v0.40.1
      CLAMAV_IMAGE: clamav/clamav:1.5.4-debian

    steps:
      - name: Validate inputs
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }
          [[ "$DEPLOYMENT_ID" =~ ^[a-f0-9]{16}$ ]] || fail "invalid deployment id"
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail "invalid repository"
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]{1,100}$ && "$SOURCE_REF" != *..* && "$SOURCE_REF" != -* ]] || fail "invalid ref"
          [[ "$ROOT_DIR" =~ ^[A-Za-z0-9._/-]{0,200}$ && "$ROOT_DIR" != *..* && "$ROOT_DIR" != /* ]] || fail "invalid root directory"
          [[ "$IMAGE" =~ ^arch-apps/[a-z0-9-]+:[a-f0-9]{16}$ ]] || fail "invalid image name"
          [[ "${IMAGE##*:}" == "$DEPLOYMENT_ID" ]] || fail "image tag must match the deployment id"
          [[ -z "$SOURCE_UPLOAD" || "$SOURCE_UPLOAD" =~ ^uploads/[a-f0-9]{16}$ ]] || fail "invalid upload reference"
          echo "CACHE_SCOPE=${IMAGE%%:*}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Decrypt build variables
        id: buildenv
        if: inputs.build_env != ''
        env:
          BUILD_ENV: ${{ inputs.build_env }}
          PLATFORM_BUILD_KEY: ${{ secrets.PLATFORM_BUILD_KEY }}
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          if (!process.env.PLATFORM_BUILD_KEY) { console.log("::error::PLATFORM_BUILD_KEY is not configured"); process.exit(1); }
          const key = crypto.createHash("sha256").update(process.env.PLATFORM_BUILD_KEY).digest();
          const [iv, tag, data] = process.env.BUILD_ENV.split(".").map((part) => Buffer.from(part, "base64"));
          const decipher = crypto.createDecipheriv("aes-256-gcm", key, iv);
          decipher.setAAD(Buffer.from(process.env.DEPLOYMENT_ID));
          decipher.setAuthTag(tag);
          const env = JSON.parse(Buffer.concat([decipher.update(data), decipher.final()]).toString("utf8"));
          // Mask before anything else can print a value. Very short values would mask ordinary log text.
          for (const value of Object.values(env)) {
            for (const line of String(value).split(/\r?\n/)) if (line.trim().length >= 3) console.log(`::add-mask::${line}`);
          }
          const dir = `${process.env.RUNNER_TEMP}/build-secrets`;
          fs.mkdirSync(dir, { mode: 0o700 });
          for (const [name, value] of Object.entries(env)) {
            if (!/^[A-Za-z_][A-Za-z0-9_]{0,127}$/.test(name) || /^BUILDKIT_/i.test(name)) throw new Error("invalid variable name");
            fs.writeFileSync(`${dir}/${name}`, String(value), { mode: 0o600 });
          }
          // Cache invalidation hash. An HMAC cannot be brute-forced back into short values.
          const hash = crypto.createHmac("sha256", key).update(JSON.stringify(Object.entries(env).sort())).digest("hex");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `hash=${hash}\n`);
          console.log(`Decrypted ${Object.keys(env).length} build variable(s)`);
          NODE

      - name: Check out source
        if: inputs.source_upload == ''
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.BUILDER_REPO_TOKEN || github.token }}
          path: source
          persist-credentials: false

      - name: Fetch uploaded archive
        if: inputs.source_upload != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_upload }}
          path: upload
          persist-credentials: false

      # Extracts with strict limits: no absolute paths, no "..", no links or devices, at most
      # 20,000 entries and 300 MB uncompressed, and a bounded compression ratio.
      - name: Unpack uploaded archive
        if: inputs.source_upload != ''
        run: |
          python3 - "$GITHUB_WORKSPACE/upload/source.zip" "$GITHUB_WORKSPACE/source" <<'PY'
          import os, stat, sys, zipfile
          archive, target = sys.argv[1], sys.argv[2]
          size = os.path.getsize(archive)
          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()
              if len(entries) > 20000: sys.exit("::error::archive has too many files")
              total = sum(e.file_size for e in entries)
              if total > 300 * 1024 * 1024: sys.exit("::error::archive expands beyond 300 MB")
              if size and total / size > 200: sys.exit("::error::archive compression ratio is suspicious")
              names = [e.filename for e in entries if not e.is_dir()]
              # A single top-level folder is unwrapped so the project root is the archive content.
              tops = {n.split("/", 1)[0] for n in names}
              strip = len(tops) == 1 and all("/" in n for n in names)
              os.makedirs(target, exist_ok=True)
              for e in entries:
                  name = e.filename.split("/", 1)[1] if strip and "/" in e.filename else e.filename
                  mode = (e.external_attr >> 16) & 0o170000
                  if not name or e.is_dir(): continue
                  if name.startswith("/") or "\\" in name or ".." in name.split("/") or mode in (stat.S_IFLNK, stat.S_IFCHR, stat.S_IFBLK, stat.S_IFIFO):
                      sys.exit(f"::error::unsafe archive entry: {name[:80]}")
                  path = os.path.join(target, name)
                  if not os.path.realpath(path).startswith(os.path.realpath(target) + os.sep):
                      sys.exit(f"::error::archive entry escapes the project folder: {name[:80]}")
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  with z.open(e) as src, open(path, "wb") as dst:
                      dst.write(src.read())
              print(f"Unpacked {len(names)} files ({total} bytes)")
          PY
          sha=$(sha256sum "$GITHUB_WORKSPACE/upload/source.zip" | cut -c1-12)
          echo "UPLOAD_SHA=$sha" >> "$GITHUB_ENV"

      - name: Scan source for malware
        run: |
          set -o pipefail
          docker volume create clamdb >/dev/null
          docker run --rm -v clamdb:/var/lib/clamav -v "$GITHUB_WORKSPACE/source:/scan:ro" \
            --entrypoint sh "$CLAMAV_IMAGE" -c '
              freshclam --stdout --quiet >/dev/null 2>&1 || echo "Signature update skipped; using bundled signatures"
              clamscan --recursive --infected --detect-pua=yes --include-pua=Coin \
                --max-filesize=100M --max-scansize=500M --alert-exceeds-max=no --stdout /scan'

      - name: Plan the build
        id: plan
        run: |
          set -euo pipefail
          APP_DIR="$GITHUB_WORKSPACE/source/$ROOT_DIR"
          SECRETS_DIR="$RUNNER_TEMP/build-secrets"
          [ -d "$APP_DIR" ] || { echo "::error::root directory not found"; exit 1; }
          echo "context=$APP_DIR" >> "$GITHUB_OUTPUT"
          if [ -n "$SOURCE_UPLOAD" ]; then echo "commit=upload-${UPLOAD_SHA}" >> "$GITHUB_OUTPUT"; else echo "commit=$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" >> "$GITHUB_OUTPUT"; fi

          # Every build variable is offered as a BuildKit secret file.
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "secretfiles<<$delimiter"
            if [ -d "$SECRETS_DIR" ]; then for file in "$SECRETS_DIR"/*; do echo "$(basename "$file")=$file"; done; fi
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

          if [ -f "$APP_DIR/Dockerfile" ]; then
            echo "Building with the repository Dockerfile"
            echo "file=$APP_DIR/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "syntax=" >> "$GITHUB_OUTPUT"
            # Dockerfiles commonly read build variables through ARG. Single-line values only, so a
            # value can never inject another build argument.
            {
              echo "dockerargs<<$delimiter"
              if [ -d "$SECRETS_DIR" ]; then
                for file in "$SECRETS_DIR"/*; do
                  if [ "$(wc -l < "$file")" -eq 0 ]; then echo "$(basename "$file")=$(cat "$file")"; fi
                done
              fi
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          elif [ -f "$APP_DIR/index.html" ] && ! ls "$APP_DIR"/{package.json,requirements.txt,pyproject.toml,go.mod,Cargo.toml,Gemfile,composer.json,pom.xml,build.gradle,deno.json} >/dev/null 2>&1; then
            echo "Plain static site, serving it with Caddy"
            # Never publish repository metadata or local secrets with the site.
            printf '%s\n' .git .github .env '.env.*' node_modules >> "$APP_DIR/.dockerignore"
            cat > "$RUNNER_TEMP/Dockerfile.static" <<'DOCKERFILE'
          FROM caddy:2.11.4-alpine
          COPY . /srv
          RUN printf ':{$PORT:3000} {\n\troot * /srv\n\tencode gzip\n\ttry_files {path} {path}/ {path}.html\n\tfile_server\n}\n' > /etc/caddy/Caddyfile
          EXPOSE 3000
          DOCKERFILE
            echo "file=$RUNNER_TEMP/Dockerfile.static" >> "$GITHUB_OUTPUT"
            echo "syntax=" >> "$GITHUB_OUTPUT"
            printf 'dockerargs<<%s\n%s\n' "$delimiter" "$delimiter" >> "$GITHUB_OUTPUT"
          else
            echo "No Dockerfile, detecting the framework with Railpack $RAILPACK_VERSION"
            # Railpack uses /tmp/railpack as its cache directory, so the binary lives elsewhere.
            mkdir -p "$RUNNER_TEMP/railpack-bin"
            curl -fsSL "https://github.com/railwayapp/railpack/releases/download/${RAILPACK_VERSION}/railpack-${RAILPACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$RUNNER_TEMP/railpack-bin" railpack
            env_flags=()
            if [ -d "$SECRETS_DIR" ]; then
              for file in "$SECRETS_DIR"/*; do env_flags+=(--env "$(basename "$file")=$(cat "$file")"); done
            fi
            "$RUNNER_TEMP/railpack-bin/railpack" prepare "$APP_DIR" "${env_flags[@]}" \
              --plan-out "$RUNNER_TEMP/railpack-plan.json" --info-out "$RUNNER_TEMP/railpack-info.json"
            # Railpack records only secret names in the plan. Refuse to build if a value leaked into it.
            if [ -d "$SECRETS_DIR" ]; then
              for file in "$SECRETS_DIR"/*; do
                if [ "$(wc -c < "$file")" -ge 6 ] && grep -qF -- "$(cat "$file")" "$RUNNER_TEMP/railpack-plan.json"; then
                  echo "::error::a build variable value appeared in the build plan"; exit 1
                fi
              done
            fi
            echo "file=$RUNNER_TEMP/railpack-plan.json" >> "$GITHUB_OUTPUT"
            echo "syntax=ghcr.io/railwayapp/railpack-frontend:${RAILPACK_VERSION}" >> "$GITHUB_OUTPUT"
            printf 'dockerargs<<%s\n%s\n' "$delimiter" "$delimiter" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ steps.plan.outputs.context }}
          file: ${{ steps.plan.outputs.file }}
          build-args: |
            ${{ steps.plan.outputs.syntax && format('BUILDKIT_SYNTAX={0}', steps.plan.outputs.syntax) || '' }}
            cache-key=${{ env.CACHE_SCOPE }}
            ${{ steps.buildenv.outputs.hash && format('secrets-hash={0}', steps.buildenv.outputs.hash) || '' }}
            ${{ steps.plan.outputs.dockerargs }}
          secret-files: ${{ steps.plan.outputs.secretfiles }}
          labels: |
            arch.platform.commit=${{ steps.plan.outputs.commit }}
            arch.platform.repository=${{ inputs.repository }}
          tags: ${{ inputs.image }}
          load: true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Remove build variables
        if: always()
        run: rm -rf "$RUNNER_TEMP/build-secrets"

      # Dependencies installed during the build are scanned too: the app's working directory is
      # copied out of the image and checked with the same scanner.
      - name: Scan built app for malware
        run: |
          set -o pipefail
          workdir=$(docker image inspect -f '{{.Config.WorkingDir}}' "$IMAGE")
          [ -n "$workdir" ] && [ "$workdir" != "/" ] || workdir=/
          cid=$(docker create "$IMAGE")
          mkdir -p "$RUNNER_TEMP/image-app"
          if [ "$workdir" = "/" ]; then docker export "$cid" | tar -x -C "$RUNNER_TEMP/image-app" --exclude=proc --exclude=sys --exclude=dev; else docker cp "$cid:$workdir/." "$RUNNER_TEMP/image-app"; fi
          docker rm "$cid" >/dev/null
          echo "Scanning $workdir from the built image"
          docker run --rm -v clamdb:/var/lib/clamav -v "$RUNNER_TEMP/image-app:/scan:ro" \
            --entrypoint clamscan "$CLAMAV_IMAGE" --recursive --infected --detect-pua=yes --include-pua=Coin \
            --max-filesize=100M --max-scansize=500M --alert-exceeds-max=no --stdout /scan
          rm -rf "$RUNNER_TEMP/image-app"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.SERVER_IP }}
          version: latest

      - name: Load image on the server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          BUILDER_SSH_KEY: ${{ secrets.BUILDER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          printf '%s\n' "$BUILDER_SSH_KEY" > "$RUNNER_TEMP/key"
          # Pin the server's host key so the image can only go to the real machine.
          printf '%s %s\n' "$SERVER_IP" "$SERVER_HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          docker image inspect "$IMAGE" --format 'Image size: {{.Size}} bytes'
          # The key's forced command validates the archive and accepts only this exact tag.
          docker save "$IMAGE" | gzip -1 | ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$SERVER_USER@$SERVER_IP" "load $IMAGE"
          rm -f "$RUNNER_TEMP/key"
