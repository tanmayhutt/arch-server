<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0a0c10" rx="15"/>
  <!-- Server Rack Frame -->
  <rect x="25" y="20" width="50" height="60" fill="none" stroke="#58a6ff" stroke-width="4" rx="4"/>
  
  <!-- Server 1 -->
  <rect x="30" y="30" width="40" height="10" fill="#58a6ff" rx="2"/>
  <!-- Server 1 lights -->
  <circle cx="35" cy="35" r="2" fill="#0a0c10"/>
  <circle cx="42" cy="35" r="2" fill="#0a0c10"/>
  
  <!-- Server 2 -->
  <rect x="30" y="45" width="40" height="10" fill="#58a6ff" rx="2"/>
  <!-- Server 2 lights -->
  <circle cx="35" cy="50" r="2" fill="#0a0c10"/>
  <circle cx="42" cy="50" r="2" fill="#0a0c10"/>
  
  <!-- Server 3 -->
  <rect x="30" y="60" width="40" height="10" fill="#58a6ff" rx="2"/>
  <!-- Server 3 lights -->
  <circle cx="35" cy="65" r="2" fill="#0a0c10"/>
  <circle cx="42" cy="65" r="2" fill="#0a0c10"/>
</svg>