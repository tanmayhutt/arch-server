server {
    listen 80;
    server_name localhost;

    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS. Resolving upstreams per request keeps the site online when a
    # backend container is down and follows it when Compose recreates it with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Encoded slashes can sidestep path-scoped Cloudflare Access rules. No route here needs them.
    if ($request_uri ~* "%2f") {
        return 400;
    }

    location = /healthz {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","service":"arch-server-web"}';
    }

    location = /api/status {
        set $telemetry_upstream telemetry:3000;
        proxy_pass http://$telemetry_upstream/status;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Owner-only deploy console. Cloudflare Access protects these paths, and the
    # platform service independently verifies the Access token on every request.
    location /api/platform/ {
        set $platform_upstream platform:4000;
        proxy_pass http://$platform_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /console {
        root   /usr/share/nginx/html;
        try_files /index.html =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
