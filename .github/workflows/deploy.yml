name: Deploy to Arch Server via Tailscale

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: arch-server-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.SERVER_IP }}
          version: latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu

            # Navigate to the services directory
            mkdir -p ~/services/arch-server
            cd ~/services/arch-server
            
            # Clone or update the repository
            if [ ! -d ".git" ]; then
              git clone https://github.com/tanmayhutt/arch-server.git .
            else
              git fetch origin main
              git merge --ff-only origin/main
            fi
            
            # Build/deploy Docker containers from root
            umask 077
            printf '%s\n' "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" > .env
            docker compose up -d --build --remove-orphans
