name: Deploy to Arch Server via Tailscale

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Navigate to the services directory
            mkdir -p ~/services/arch-server-website
            cd ~/services/arch-server-website
            
            # Clone or update the repository
            if [ ! -d ".git" ]; then
              git clone https://github.com/tanmayhutt/arch-server.git .
            else
              git pull origin main
            fi
            
            # Navigate to website and build/deploy Docker containers
            cd website
            sudo docker-compose up -d --build
