name: Deploy to Arch Server via Tailscale

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.68.1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Navigate to the services directory
            mkdir -p ~/services/arch-server
            cd ~/services/arch-server
            
            # Clone or update the repository
            if [ ! -d ".git" ]; then
              git clone https://github.com/tanmayhutt/arch-server.git .
            else
              git pull origin main
            fi
            
            # Build/deploy Docker containers from root
            echo "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" > .env
            docker rm -f arch-server-docs cloudflared || true
            docker compose up -d --build
