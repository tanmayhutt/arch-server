name: Build app

# Dispatched by the deploy console. Builds one repository into an image and loads it
# into the server's Docker over Tailscale SSH. The console then runs and routes it.
run-name: build ${{ inputs.deployment_id }}

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Deployment id from the console
        required: true
        type: string
      repository:
        description: Source repository (owner/name)
        required: true
        type: string
      ref:
        description: Branch, tag, or commit
        required: true
        type: string
      root_dir:
        description: App directory inside the repository
        required: false
        type: string
        default: ''
      image:
        description: Image tag to load on the server
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-${{ inputs.deployment_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      SOURCE_REPOSITORY: ${{ inputs.repository }}
      SOURCE_REF: ${{ inputs.ref }}
      ROOT_DIR: ${{ inputs.root_dir }}
      IMAGE: ${{ inputs.image }}
      RAILPACK_VERSION: v0.40.1

    steps:
      - name: Validate inputs
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }
          [[ "$DEPLOYMENT_ID" =~ ^[a-f0-9]{16}$ ]] || fail "invalid deployment id"
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail "invalid repository"
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]{1,100}$ && "$SOURCE_REF" != *..* && "$SOURCE_REF" != -* ]] || fail "invalid ref"
          [[ "$ROOT_DIR" =~ ^[A-Za-z0-9._/-]{0,200}$ && "$ROOT_DIR" != *..* && "$ROOT_DIR" != /* ]] || fail "invalid root directory"
          [[ "$IMAGE" =~ ^arch-apps/[a-z0-9-]+:[a-f0-9]{16}$ ]] || fail "invalid image name"
          echo "CACHE_SCOPE=${IMAGE%%:*}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.BUILDER_REPO_TOKEN || github.token }}
          path: source
          persist-credentials: false

      - name: Plan the build
        id: plan
        run: |
          set -eu
          APP_DIR="$GITHUB_WORKSPACE/source/$ROOT_DIR"
          [ -d "$APP_DIR" ] || { echo "::error::root directory not found"; exit 1; }
          echo "context=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -f "$APP_DIR/Dockerfile" ]; then
            echo "Building with the repository Dockerfile"
            echo "file=$APP_DIR/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "syntax=" >> "$GITHUB_OUTPUT"
          else
            echo "No Dockerfile, detecting the framework with Railpack $RAILPACK_VERSION"
            # Railpack uses /tmp/railpack as its cache directory, so the binary lives elsewhere.
            mkdir -p "$RUNNER_TEMP/railpack-bin"
            curl -fsSL "https://github.com/railwayapp/railpack/releases/download/${RAILPACK_VERSION}/railpack-${RAILPACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$RUNNER_TEMP/railpack-bin" railpack
            "$RUNNER_TEMP/railpack-bin/railpack" prepare "$APP_DIR" --plan-out "$RUNNER_TEMP/railpack-plan.json" --info-out "$RUNNER_TEMP/railpack-info.json"
            echo "file=$RUNNER_TEMP/railpack-plan.json" >> "$GITHUB_OUTPUT"
            echo "syntax=ghcr.io/railwayapp/railpack-frontend:${RAILPACK_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ steps.plan.outputs.context }}
          file: ${{ steps.plan.outputs.file }}
          build-args: |
            ${{ steps.plan.outputs.syntax && format('BUILDKIT_SYNTAX={0}', steps.plan.outputs.syntax) || '' }}
            cache-key=${{ env.CACHE_SCOPE }}
          labels: |
            arch.platform.commit=${{ steps.plan.outputs.commit }}
            arch.platform.repository=${{ inputs.repository }}
          tags: ${{ inputs.image }}
          load: true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.SERVER_IP }}
          version: latest

      - name: Load image on the server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          printf '%s\n' "$SERVER_SSH_KEY" > "$RUNNER_TEMP/key"
          docker image inspect "$IMAGE" --format 'Image size: {{.Size}} bytes'
          docker save "$IMAGE" | gzip -1 | ssh -i "$RUNNER_TEMP/key" -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "$SERVER_USER@$SERVER_IP" 'gunzip | docker load'
          rm -f "$RUNNER_TEMP/key"
